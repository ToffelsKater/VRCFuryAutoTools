<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Y2K logo, same palette and fonts as the landing page (styles.css). -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Michroma&amp;display=swap');
    text { font-family: Michroma, sans-serif; }
  </style>
  <defs>
    <clipPath id="tile"><rect width="600" height="600" rx="120"/></clipPath>
    <radialGradient id="glowCyan" cx=".12" cy=".08" r=".6"><stop offset="0" stop-color="#3fe0ff" stop-opacity=".45"/><stop offset="1" stop-color="#3fe0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPink" cx=".92" cy=".3" r=".6"><stop offset="0" stop-color="#ff3fb4" stop-opacity=".35"/><stop offset="1" stop-color="#ff3fb4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBlue" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#2f5bff" stop-opacity=".3"/><stop offset="1" stop-color="#2f5bff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b1a3a" stroke-opacity=".07"/></pattern>
    <linearGradient id="gel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb0ff"/><stop offset=".5" stop-color="#2f5bff"/><stop offset="1" stop-color="#1f2fa8"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".38" stop-color="#c9cde6"/><stop offset=".5" stop-color="#6d7096"/><stop offset=".62" stop-color="#d8dcf2"/><stop offset="1" stop-color="#8d90b4"/></linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb0ff"/><stop offset=".55" stop-color="#2f5bff"/><stop offset="1" stop-color="#1f3fd0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#2f5bff" flood-opacity=".35"/></filter>
    <filter id="sink" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#14113a" flood-opacity=".45"/></filter>

    <!-- Speech bubble with its tail at the bottom left -->
    <path id="bubble" d="M196 140H404Q462 140 462 198V262Q462 320 404 320H252L182 378 198 320H196Q138 320 138 262V198Q138 140 196 140Z"/>
    <clipPath id="bubbleClip"><use href="#bubble"/></clipPath>
    <path id="spark" d="M0-1 .2-.2 1 0 .2.2 0 1-.2.2-1 0-.2-.2Z"/>
  </defs>

  <!-- Background tile: lavender, glows, grid -->
  <g clip-path="url(#tile)">
    <rect width="600" height="600" fill="#e9e6f7"/>
    <rect width="600" height="600" fill="url(#glowCyan)"/>
    <rect width="600" height="600" fill="url(#glowPink)"/>
    <rect width="600" height="600" fill="url(#glowBlue)"/>
    <rect width="600" height="600" fill="url(#grid)"/>
  </g>
  <rect x="3" y="3" width="594" height="594" rx="117" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="6"/>

  <!-- Gel speech bubble -->
  <use href="#bubble" transform="translate(0 14)" fill="#3fe0ff" opacity=".5" filter="url(#soft)"/>
  <use href="#bubble" fill="url(#gel)"/>
  <g clip-path="url(#bubbleClip)">
    <rect x="156" y="150" width="288" height="66" rx="33" fill="url(#gloss)" opacity=".75"/>
    <ellipse cx="300" cy="330" rx="150" ry="30" fill="#3fe0ff" opacity=".45" filter="url(#soft)"/>
  </g>
  <use href="#bubble" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="4" stroke-linejoin="round"/>
  <text x="300" y="262" text-anchor="middle" font-size="72" letter-spacing="2" fill="#fff" filter="url(#sink)">VRC</text>

  <!-- Sparks -->
  <use href="#spark" transform="translate(478 96) scale(30)" fill="#ff3fb4"/>
  <use href="#spark" transform="translate(516 144) scale(14)" fill="#3fe0ff"/>
  <use href="#spark" transform="translate(100 330) scale(20)" fill="#3fe0ff"/>
  <use href="#spark" transform="translate(150 88) scale(10)" fill="#ff3fb4"/>

  <!-- Wordmark -->
  <rect x="216" y="414" width="168" height="36" rx="18" fill="url(#pill)"/>
  <rect x="217" y="415" width="166" height="17" rx="8.5" fill="#fff" fill-opacity=".25"/>
  <text x="300" y="438" text-anchor="middle" font-size="15" letter-spacing="3" fill="#fff">VRCFURY</text>
  <text x="300" y="518" text-anchor="middle" font-size="46" letter-spacing="-1" fill="url(#chrome)" stroke="#1b1a3a" stroke-opacity=".55" stroke-width="1.5" filter="url(#lift)">AUTO TOOLS</text>
</svg>
